<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassette OBS Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="themes.js"></script>

    <style>
        html, body {
            background-color: transparent !important;
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; user-select: none;
        }
        .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
        .cassette-wrapper { position: absolute; top: 0; left: 0; width: 380px; height: 190px; }
        .cassette-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        #cuerpo-cassette { z-index: 1; }
        #detalles-1      { z-index: 2; }
        .gear-container  { z-index: 3; }
        #detalles-2      { z-index: 4; }
        #cintas-fondo    { z-index: 5; }
        #tape-label      { z-index: 6; }

        .gear { position: absolute; width: 64px; height: 64px; top: 49px; transform-origin: center center; }
        .gear-left { left: 95px; }
        .gear-right { left: 218px; }
        .is-playing .gear { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .tape-label { position: absolute; display: flex; align-items: center; padding: 0 8px; overflow: hidden; box-sizing: border-box; }
        .tape-label-classic { top: 17px; left: 31px; width: 318px; height: 40px; }
        .tape-label-night   { top: 14px; left: 71px; width: 225px; height: 36px; }

        .album-art { width: 30px; height: 30px; object-fit: cover; border-radius: 2px; margin-right: 8px; flex-shrink: 0; border: 1px solid rgba(0, 0, 0, 0.2); }
        .track-info-container { overflow: hidden; white-space: nowrap; width: 100%; position: relative; display: flex; align-items: center; }
        .track-text-scroll { display: inline-block; white-space: nowrap; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #111111; }
        .marquee-active { animation: marquee 10s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>

    <div id="cassette-widget" class="cassette-wrapper">
        <img id="cuerpo-cassette" class="cassette-layer pixelated" src="" alt="">
        <img id="detalles-1" class="cassette-layer pixelated" src="" alt="">
        <img id="gear-left" class="gear gear-left cassette-layer pixelated gear-container" src="" alt="">
        <img id="gear-right" class="gear gear-right cassette-layer pixelated gear-container" src="" alt="">
        <img id="detalles-2" class="cassette-layer pixelated" src="" alt="">
        <img id="cintas-fondo" class="cassette-layer pixelated" src="" alt="">

        <div id="tape-label" class="tape-label">
            <img id="album-cover" class="album-art pixelated" src="" alt="">
            <div class="track-info-container">
                <div id="track-text" class="track-text-scroll">Cargando...</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const designKey = params.get('design') || 'night';
            const theme = CASSETTE_THEMES[designKey] || CASSETTE_THEMES['night'];

            // Aplicar assets del tema seleccionado
            document.getElementById('cuerpo-cassette').src = theme.cuerpo;
            document.getElementById('detalles-1').src = theme.detalles1;
            document.getElementById('gear-left').src = theme.engranaje;
            document.getElementById('gear-right').src = theme.engranaje;
            document.getElementById('cintas-fondo').src = theme.cintas;

            const detalles2 = document.getElementById('detalles-2');
            if (theme.detalles2) {
                detalles2.src = theme.detalles2;
                detalles2.style.display = 'block';
            } else {
                detalles2.style.display = 'none';
            }

            const tapeLabel = document.getElementById('tape-label');
            tapeLabel.className = `tape-label ${theme.labelClass}`;

            if (theme.customizable) {
                document.getElementById('cuerpo-cassette').style.filter = `hue-rotate(${params.get('hue') || 0}deg) saturate(${params.get('saturate') || 100}%)`;
                tapeLabel.style.backgroundColor = params.get('bg') || '#ffffff';
            } else {
                document.getElementById('cuerpo-cassette').style.filter = 'none';
                tapeLabel.style.backgroundColor = 'transparent';
            }

            const trackText = document.getElementById('track-text');
            trackText.style.color = params.get('color') || '#111111';

            // Last.fm Polling
            const user = params.get('user');
            const apiKey = params.get('apikey');
            const manualTitle = params.get('title') || 'Lofi Chill Beats';
            const manualCover = params.get('cover') || '';

            async function fetchTrack() {
                if (!user || !apiKey) {
                    render(manualTitle, manualCover, true);
                    return;
                }
                try {
                    const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(user)}&api_key=${encodeURIComponent(apiKey)}&format=json&limit=1`);
                    const data = await res.json();
                    if (data.recenttracks?.track.length > 0) {
                        const t = data.recenttracks.track[0];
                        render(`${t.name} - ${t.artist['#text']}`, t.image[t.image.length - 1]['#text'], t['@attr']?.nowplaying === 'true');
                    }
                } catch (e) { render(manualTitle, manualCover, false); }
            }

            function render(title, cover, isPlaying) {
                document.getElementById('album-cover').src = cover;
                trackText.innerText = title;
                trackText.classList.remove('marquee-active');
                document.getElementById('cassette-widget').classList.toggle('is-playing', isPlaying);

                if (trackText.offsetWidth > (tapeLabel.clientWidth - 35)) {
                    trackText.innerHTML = `${title} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${title} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
                    trackText.classList.add('marquee-active');
                }
            }

            fetchTrack();
            setInterval(fetchTrack, 4000);
        };
    </script>
</body>
</html>
