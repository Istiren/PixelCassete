<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassette OBS Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .cassette-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 380px;
            height: 190px;
        }

        .cassette-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .gear {
            position: absolute;
            width: 64px;
            height: 64px;
            top: 49px;
            z-index: 3;
            transform-origin: center center;
        }

        .gear-left { left: 97px; }
        .gear-right { left: 220px; }

        .is-playing .gear {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tape-label {
            position: absolute;
            top: 17px;
            left: 31px;
            width: 318px;
            height: 40px;
            z-index: 4;
            display: flex;
            align-items: center;
            padding: 0 6px;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .album-art {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 2px;
            margin-right: 8px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .track-info-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .track-text-scroll {
            display: inline-block;
            white-space: nowrap;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #111111;
        }

        .marquee-active {
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        #cuerpo-cassette { z-index: 2; }
        #detalles-fijos { z-index: 5; }
        #cintas-fondo { z-index: 1; }
    </style>
</head>
<body>

    <div id="cassette-widget" class="cassette-wrapper">
        <img id="cintas-fondo" class="cassette-layer pixelated" src="cintas_fondo.png" alt="">

        <div id="tape-label" class="tape-label">
            <img id="album-cover" class="album-art pixelated" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&auto=format&fit=crop&q=60" alt="">
            <div class="track-info-container">
                <div id="track-text" class="track-text-scroll">
                    Cargando música...
                </div>
            </div>
        </div>

        <img id="gear-left" class="gear gear-left cassette-layer pixelated" src="engranaje.png" alt="">
        <img id="gear-right" class="gear gear-right cassette-layer pixelated" src="engranaje.png" alt="">
        <img id="cuerpo-cassette" class="cassette-layer pixelated" src="cuerpo_cassette.png" alt="">
        <img id="detalles-fijos" class="cassette-layer pixelated" src="detalles_fijos.png" alt="">
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);

            // 1. Estilos visuales por URL
            const hue = params.get('hue') || '0';
            const saturate = params.get('saturate') || '100';
            const tapeBg = params.get('bg') || '#ffffff';
            const tapeText = params.get('color') || '#111111';
            const speed = params.get('speed') || '10';

            // Parámetros de API
            const lastfmUser = params.get('user');
            const apiKey = params.get('apikey');

            // Fallback manual si no hay API
            const manualTitle = params.get('title') || 'Lofi Chill Beats - VTuber Radio';
            const manualCover = params.get('cover') || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&auto=format&fit=crop&q=60';

            // Aplicar estilos
            document.getElementById('cuerpo-cassette').style.filter = `hue-rotate(${hue}deg) saturate(${saturate}%)`;
            const tapeLabel = document.getElementById('tape-label');
            tapeLabel.style.backgroundColor = tapeBg;

            const trackText = document.getElementById('track-text');
            trackText.style.color = tapeText;
            trackText.style.animationDuration = `${speed}s`;

            const albumCover = document.getElementById('album-cover');
            const cassetteWidget = document.getElementById('cassette-widget');

            let currentTrackName = "";

            function renderTrack(title, coverUrl, isPlaying) {
                if (currentTrackName === title + isPlaying) return;
                currentTrackName = title + isPlaying;

                albumCover.src = coverUrl || manualCover;
                trackText.innerText = title;
                trackText.classList.remove('marquee-active');

                if (isPlaying) {
                    cassetteWidget.classList.add('is-playing');
                } else {
                    cassetteWidget.classList.remove('is-playing');
                }

                if (trackText.offsetWidth > (tapeLabel.clientWidth - 45)) {
                    trackText.innerHTML = `${title} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${title} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
                    trackText.classList.add('marquee-active');
                }
            }

            // Motor de consulta a Last.fm
            async function fetchCurrentlyPlaying() {
                if (!lastfmUser || !apiKey) {
                    renderTrack(manualTitle, manualCover, true);
                    return;
                }

                try {
                    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(lastfmUser)}&api_key=${encodeURIComponent(apiKey)}&format=json&limit=1`;
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.recenttracks && data.recenttracks.track.length > 0) {
                        const track = data.recenttracks.track[0];
                        const isNowPlaying = track['@attr'] && track['@attr'].nowplaying === 'true';
                        
                        const trackName = track.name;
                        const artistName = track.artist['#text'];
                        const fullTitle = `${trackName} - ${artistName}`;
                        
                        const images = track.image;
                        const coverImage = (images && images.length > 0) ? images[images.length - 1]['#text'] : manualCover;

                        renderTrack(fullTitle, coverImage, isNowPlaying);
                    }
                } catch (error) {
                    console.error("Error al consultar Last.fm:", error);
                    renderTrack(manualTitle, manualCover, false);
                }
            }

            // Ejecutar al iniciar y hacer polling cada 4 segundos
            fetchCurrentlyPlaying();
            setInterval(fetchCurrentlyPlaying, 4000);
        };
    </script>
</body>
</html>
