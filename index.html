<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassette OBS Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        /* Transparent strict canvas for OBS */
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .cassette-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 380px;
            height: 190px;
        }

        .cassette-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .gear {
            position: absolute;
            width: 48px;
            height: 48px;
            top: 60px;
            z-index: 3;
            transform-origin: center center;
        }

        .gear-left { left: 122px; }
        .gear-right { left: 210px; }

        .is-playing .gear {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tape-label {
            position: absolute;
            top: 17px;
            left: 31px;
            width: 318px;
            height: 40px;
            z-index: 4;
            display: flex;
            align-items: center;
            padding: 0 6px;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .album-art {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 2px;
            margin-right: 8px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .track-info-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .track-text-scroll {
            display: inline-block;
            white-space: nowrap;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #111111;
        }

        .marquee-active {
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        #cuerpo-cassette { z-index: 2; }
        #detalles-fijos { z-index: 5; }
        #cintas-fondo { z-index: 1; }
    </style>
</head>
<body>

    <div id="cassette-widget" class="cassette-wrapper is-playing">
        <img id="cintas-fondo" class="cassette-layer pixelated" src="cintas_fondo.png" alt="">

        <div id="tape-label" class="tape-label">
            <img id="album-cover" class="album-art pixelated" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&auto=format&fit=crop&q=60" alt="">
            <div class="track-info-container">
                <div id="track-text" class="track-text-scroll">
                    Lofi Chill Beats - VTuber Radio Vol. 1
                </div>
            </div>
        </div>

        <img id="gear-left" class="gear gear-left cassette-layer pixelated" src="engranaje.png" alt="">
        <img id="gear-right" class="gear gear-right cassette-layer pixelated" src="engranaje.png" alt="">
        <img id="cuerpo-cassette" class="cassette-layer pixelated" src="cuerpo_cassette.png" alt="">
        <img id="detalles-fijos" class="cassette-layer pixelated" src="detalles_fijos.png" alt="">
    </div>

    <script>
        const cuerpoCassette = document.getElementById('cuerpo-cassette');
        const tapeLabel = document.getElementById('tape-label');
        const trackText = document.getElementById('track-text');
        const albumCover = document.getElementById('album-cover');

        // Leer configuraciones guardadas por el panel o usar valores por defecto
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('cassette_settings') || '{}');
            
            const hue = settings.hue || 0;
            const saturate = settings.saturate || 100;
            const tapeBg = settings.tapeBg || '#ffffff';
            const tapeText = settings.tapeText || '#111111';
            const speed = settings.speed || 10;
            const font = settings.font || "'Press Start 2P', monospace";

            cuerpoCassette.style.filter = `hue-rotate(${hue}deg) saturate(${saturate}%)`;
            tapeLabel.style.backgroundColor = tapeBg;
            trackText.style.color = tapeText;
            trackText.style.animationDuration = `${speed}s`;
            trackText.style.fontFamily = font;

            if (settings.trackTitle) {
                updateTrack(settings.trackTitle, settings.coverUrl || albumCover.src);
            }
        }

        function updateTrack(title, cover) {
            albumCover.src = cover;
            trackText.innerText = title;
            trackText.classList.remove('marquee-active');
            
            if (trackText.offsetWidth > (tapeLabel.clientWidth - 45)) {
                trackText.innerHTML = `${title} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${title} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
                trackText.classList.add('marquee-active');
            }
        }

        // Escuchar cambios en tiempo real si el streamer mueve sliders en config.html
        window.addEventListener('storage', loadSettings);

        window.onload = () => {
            loadSettings();
            updateTrack(trackText.innerText, albumCover.src);
        };
    </script>
</body>
</html>
